name: Publish Contract Stubs

# Producer stubs of eval-service: com.shoplab:shoplab-eval-service:<version>:stubs.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-stubs:
    name: Verify contracts and publish stubs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify contracts and package stubs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp -s .mvn/ci-settings.xml clean verify
      - name: Deploy to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp -s .mvn/ci-settings.xml deploy -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Djacoco.skip=true
