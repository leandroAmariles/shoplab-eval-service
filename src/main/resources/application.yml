spring:
  application:
    name: eval-service
  reactor:
    context-propagation: auto
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/eval}
    username: ${POSTGRES_USER:eval}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

shoplab:
  # Assistant settings client for eval -> chat-service (LAB-59, LAB-130).
  chat:
    settings:
      client:
        base-url: ${SHOPLAB_CHAT_SETTINGS_CLIENT_BASE_URL:http://localhost:8083}
        timeout: ${SHOPLAB_CHAT_SETTINGS_CLIENT_TIMEOUT:5s}
  # History of the evaluation runs (LAB-31). Empty token = saving is off (403).
  eval:
    persistence:
      token: ${SHOPLAB_EVAL_PERSISTENCE_TOKEN:}
    history:
      trace-url-template: ${SHOPLAB_EVAL_HISTORY_TRACE_URL_TEMPLATE:http://localhost:3001/trace/{traceId}}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
